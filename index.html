<!DOCTYPE html>
<html lang="en">
<head>

  <!-- PWA -->
  <meta name="theme-color" content="#00FF41" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Commander" />
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent:#00FF41; --accent-dim:#00FF4188; --accent-bg:#00FF4115; --red:#FF0000; --gold:#FFD700; --surface:#0a0a0a; --sub:#555; --bg:#000; }
    html, body { background: var(--bg,#000); min-height: 100vh; }
    body { color: var(--accent,#00FF41); font-family: 'JetBrains Mono', 'Courier New', monospace; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: var(--accent-dim,#00FF4133); }
    ::placeholder { color: #444; font-family: 'JetBrains Mono', 'Courier New', monospace; }

    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes success-pulse {
      0%   { background: radial-gradient(ellipse at center, rgba(0,255,65,0.18) 0%, transparent 70%); }
      50%  { background: radial-gradient(ellipse at center, rgba(0,255,65,0.08) 0%, transparent 70%); }
      100% { background: transparent; }
    }
    @keyframes flicker-in {
      0%   { opacity: 0; text-shadow: 0 0 30px rgba(0,255,65,1); }
      30%  { opacity: 0.4; }
      60%  { opacity: 0.9; }
      80%  { opacity: 0.7; }
      100% { opacity: 1; }
    }
    @keyframes glitch {
      0%   { transform: skewX(0deg); text-shadow: 0 0 10px rgba(0,255,65,0.6); }
      20%  { transform: skewX(-1.5deg); text-shadow: 3px 0 #FF0000, -3px 0 #00FFFF; }
      40%  { transform: skewX(1deg); text-shadow: -2px 0 #FF0000, 2px 0 #00FFFF; }
      60%  { transform: skewX(-0.5deg); text-shadow: 2px 0 #FF0000, -2px 0 #00FFFF; }
      100% { transform: skewX(0deg); text-shadow: 0 0 10px rgba(0,255,65,0.6); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .glitch-active { animation: glitch 0.15s ease-in-out; }
    .pulse-red-anim { animation: pulse-red 1.5s ease-in-out infinite; }
    .flicker { animation: flicker-in 0.7s ease-out forwards; }
    .success-bg { animation: success-pulse 2s ease-out forwards; }
    .cursor::after { content: '_'; animation: blink 1s step-end infinite; color: var(--accent,#00FF41); }
    .fade-up { animation: fade-up 0.35s ease-out forwards; }
    .input-group { position: relative; display: flex; align-items: center; }
    .input-group .cursor { display: none; font-size: 14px; color: var(--accent,#00FF41); margin-left: 2px; }
    .input-group:focus-within .cursor { display: inline; }

    .app-container { width:100%; max-width:480px; margin:0 auto; padding:24px 16px; min-height:100vh; }
    .desktop-layout { display:flex; gap:24px; }
    .desktop-layout > .desktop-sidebar { width:280px; flex-shrink:0; }
    .desktop-layout > .desktop-main { flex:1; min-width:0; }

    @media (min-width: 820px) {
      .app-container { max-width:960px; padding:32px 40px; }
      .two-col-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
      .calendar-grid { gap:4px; }
      .calendar-grid > div { min-height:36px; font-size:11px !important; }
      .history-scroll { max-height:500px !important; }
      .desktop-flex-row { display:flex !important; gap:16px; align-items:flex-start; }
      .desktop-flex-row > * { flex:1; border-bottom:none !important; }
      .stat-grid-mobile { display:grid !important; grid-template-columns:1fr 1fr; gap:12px; }
      .stat-grid-mobile > div { padding:16px 12px; border-bottom:1px solid #0d0d0d; margin:0; }
    }
    @media (max-width: 819px) {
      .mobile-only { display:block; }
      .desktop-only { display:none !important; }
    }
    @media (min-width: 820px) {
      .mobile-only { display:none !important; }
      .desktop-only { display:block; }
      .desktop-inline { display:inline !important; }
    }
  </style>
</head>

    const DB_KEY       = 'commander_state';
    const LS_KEY       = 'cdr_state';

    let sb = null;
    let syncReady = false;

    function initSB() {
      try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); syncReady = true; }
      catch(e) { syncReady = false; }
    }

    function setSyncDot(status) {
      const dot = document.getElementById('syncDot');
      if (!dot) return;
      const c = { syncing:'#ffa726', ok:'#00FF41', error:'#ff4444', offline:'#333' };
      dot.style.background = c[status] || c.offline;
      dot.title = status.toUpperCase();
    }

    const MockDB = {
      defaultState: () => ({ streak:0, lastSubmitDate:null, logs:[], name:null, codename:null, freezes:0, xp:0 }),

      // Save to localStorage instantly, push to Supabase async
      setState: (data) => {
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
        if (syncReady && sb) MockDB._push(data);
      },

      _push: async (data) => {
        setSyncDot('syncing');
        try {
          const { error } = await sb.from('commander_sync').upsert(
            { key: DB_KEY, data: JSON.stringify(data), updated_at: new Date().toISOString() },
            { onConflict: 'key' }
          );
          if (error) throw error;
          setSyncDot('ok');
        } catch(e) {
          console.warn('[Supabase] Push failed:', e.message);
          setSyncDot('error');
        }
      },

      // Load from Supabase first, fallback to localStorage
      getState: async () => {
        initSB();
        if (syncReady && sb) {
          setSyncDot('syncing');
          try {
            const { data, error } = await sb
              .from('commander_sync')
              .select('data')
              .eq('key', DB_KEY)
              .single();
            if (error && error.code !== 'PGRST116') throw error;
            if (data && data.data) {
              const remote = JSON.parse(data.data);
              // Keep remote in sync with localStorage too
              try { localStorage.setItem(LS_KEY, JSON.stringify(remote)); } catch {}
              setSyncDot('ok');
              return remote;
            }
            // No remote data — push local up if exists
            const local = MockDB._getLocal();
            if (local) MockDB._push(local);
            setSyncDot('ok');
            return local;
          } catch(e) {
            console.warn('[Supabase] Load failed, using local:', e.message);
            setSyncDot('error');
            return MockDB._getLocal();
          }
        } else {
          setSyncDot('offline');
          return MockDB._getLocal();
        }
      },

      _getLocal: () => {
        try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; }
        catch { return null; }
      },
    };

    // QUOTE ENGINE
    // ============================================================

    const MILESTONES = [
      { days: 7, label: "APPRENTICE" },
      { days: 14, label: "GRUNT" },
      { days: 30, label: "VETERAN" },
      { days: 60, label: "ELITE" },
      { days: 90, label: "LEGEND" },

    const XP_PER_GREEN = 50, XP_PER_RED = 10, XP_MILESTONE_BONUS = 100;
    const LEVELS = [0, 200, 500, 1000, 1800, 2800, 4000, 5500, 7500, 10000];
    function getLevel(xp) {
      let lvl = 0;
      for (let i = 0; i < LEVELS.length; i++) { if (xp >= LEVELS[i]) lvl = i; }
      return { level: lvl, nextThreshold: LEVELS[lvl + 1] || null, current: xp - (LEVELS[lvl] || 0), needed: (LEVELS[lvl + 1] || xp) - (LEVELS[lvl] || 0) };
    }
    function getMilestone(streak) {
      const m = MILESTONES.filter(m => streak >= m.days);
      return m.length > 0 ? m[m.length - 1] : null;
    }
    function getNextMilestone(streak) {
      for (const m of MILESTONES) {
        if (streak < m.days) return m;
      }
      return null;
    }

    const THEMES = {

      amber: { name:"Matrix Amber", accent:"#FFB000", bg:"#000", surface:"#0d0a00", red:"#FF4400", gold:"#FFD700", secondary:"#cc8800", sub:"#665500" },
      ice: { name:"Ice Blue", accent:"#00CCFF", bg:"#000510", surface:"#0a0a14", red:"#FF3366", gold:"#FFD700", secondary:"#0099cc", sub:"#335566" },
      phantom: { name:"Phantom Purple", accent:"#BB66FF", bg:"#080010", surface:"#10041c", red:"#FF3366", gold:"#FFD700", secondary:"#9944dd", sub:"#553377" },
      ember: { name:"Ember Red", accent:"#FF5533", bg:"#100804", surface:"#1a0e08", red:"#FF0000", gold:"#FFB800", secondary:"#cc4422", sub:"#663322" },
      stealth: { name:"Stealth White", accent:"#E0E0E0", bg:"#0a0a0a", surface:"#121212", red:"#FF5555", gold:"#FFD700", secondary:"#aaa", sub:"#555" },
    };
    function getTheme() {
      try { const t = localStorage.getItem(THEME_KEY); return THEMES[t] || THEMES.cyber; } catch { return THEMES.cyber; }
    }
    function setTheme(name) {
      try { localStorage.setItem(THEME_KEY, name); } catch {}
      const t = THEMES[name] || THEMES.cyber;
      document.documentElement.style.setProperty('--accent', t.accent);
      document.documentElement.style.setProperty('--accent-dim', t.accent + '88');
      document.documentElement.style.setProperty('--accent-bg', t.accent + '15');
      document.documentElement.style.setProperty('--red', t.red);
      document.documentElement.style.setProperty('--gold', t.gold);
      document.documentElement.style.setProperty('--surface', t.surface);
      document.documentElement.style.setProperty('--sub', t.sub);
      try { document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t.accent); } catch {}
    }

    // ============================================================
    // NOTIFICATION ENGINE
    // ============================================================
    const NOTIF_KEY = 'cdr_notif';
    const REMINDER_KEY = 'cdr_reminder';
    function notifEnabled() {
      if (!("Notification" in window)) return false;
      return Notification.permission === "granted";
    }
    function requestNotifPermission() {
      if (!("Notification" in window)) return false;
      if (Notification.permission === "granted") return true;
      Notification.requestPermission();
      return false;
    }
    function setReminderTime(time) {
      try { localStorage.setItem(REMINDER_KEY, time); } catch {}
    }
    function getReminderTime() {
      try { return localStorage.getItem(REMINDER_KEY) || ""; } catch { return ""; }
    }
    function initReminderChecker() {
      const reminderTime = getReminderTime();
      if (!reminderTime) return;
      setInterval(() => {
        const now = new Date();
        const [h, m] = reminderTime.split(':').map(Number);
        if (now.getHours() === h && now.getMinutes() === m) {
          if (notifEnabled()) {
            try { new Notification("Commander's Checklist", { body: "Daily audit awaits, Commander.", icon: "icon.svg" }); } catch {}
          }
        }
      }, 60000);
    }

    // ============================================================
    // SOUND ENGINE
    // ============================================================
    const SOUND_KEY = 'cdr_sound';
    function soundEnabled() {
      try { const v = localStorage.getItem(SOUND_KEY); return v === null ? true : v === 'true'; }
      catch { return true; }
    }
    function toggleSound() {
      const next = !soundEnabled();
      try { localStorage.setItem(SOUND_KEY, next); } catch {}
      return next;
    }
    function playSuccessSound() {
      if (!soundEnabled()) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [{ freq:523, start:0, dur:0.08 }, { freq:659, start:0.09, dur:0.08 }, { freq:784, start:0.18, dur:0.18 }]
          .forEach(({ freq, start, dur }) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = "square";
            osc.frequency.setValueAtTime(freq, now + start);
            gain.gain.setValueAtTime(0.12, now + start);
            gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
            osc.start(now + start); osc.stop(now + start + dur + 0.01);
          });
      } catch(e) {}
    }

    function CRTOverlay() {
      return (
        <div style={{
          position:"fixed", inset:0, pointerEvents:"none", zIndex:9999,
          background:"repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.013) 2px, rgba(0,255,65,0.013) 4px)",

    function GlitchHeader() {
      const [active, setActive] = useState(false);
      useEffect(() => {
        const iv = setInterval(() => {
          setActive(true);

    function Btn({ onClick, children, variant="primary", disabled }) {
      const [pressed, setPressed] = useState(false);
      const C = { primary:{b:"#00FF41",t:"#00FF41",g:"rgba(0,255,65,0.25)"}, danger:{b:"#FF0000",t:"#FF0000",g:"rgba(255,0,0,0.25)"}, warn:{b:"#FFD700",t:"#FFD700",g:"rgba(255,215,0,0.25)"} };

      return (
        <button onClick={() => { if(!disabled){setPressed(true);setTimeout(()=>setPressed(false),120);onClick?.();} }}

            background: pressed ? c.g : "transparent",
            border:`1px solid ${disabled?"#2a2a2a":c.b}`,

    function TypewriterText({ text, speed = 25 }) {
      const [displayed, setDisplayed] = useState("");
      const idx = useRef(0);
      useEffect(() => {
        idx.current = 0;
        setDisplayed("");
        const iv = setInterval(() => {
          if (idx.current < text.length) {
            setDisplayed(text.slice(0, idx.current + 1));
            idx.current++;
          } else { clearInterval(iv); }
        }, speed);
        return () => clearInterval(iv);
      }, [text, speed]);
      return <>{displayed}</>;
    }

    function QuoteBox({ text, variant="discipline" }) {
      const col = variant==="shutdown"?"#FF0000":variant==="restore"?"#FFD700":"#00FF41";
      return (
        <div style={{
          border:`1px solid ${col}18`,
          borderLeft:`3px solid ${col}`,
          padding:"14px 16px", margin:"16px 0",
          background:`${col}07`,
        }}>
          <div style={{
            fontSize:"11px", color:col, letterSpacing:"0.05em",
            lineHeight:"1.8", textShadow:`0 0 6px ${col}44`, fontStyle:"italic",
          }}>
            // "<TypewriterText text={text} />"
          </div>
        </div>
      );
    }

    function ProgressBar({ label, onComplete, alterEgoWon }) {
      const [pct, setPct] = useState(0);
      const [done, setDone] = useState(false);
      const fired = useRef(false);
      useEffect(() => {
        const steps = [0,15,30,48,62,78,89,95,100];
        let i = 0;
        const iv = setInterval(() => {
          if (i < steps.length) {
            const val = steps[i];
            setPct(val);
            if (val===100 && !fired.current && !alterEgoWon) { fired.current=true; playSuccessSound(); }
            i++;
          } else { setDone(true); clearInterval(iv); setTimeout(onComplete, 600); }
        }, 280);
        return () => clearInterval(iv);
      }, []);
      const bars = Math.floor(pct/4);

    function ParticleBurst() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const w = canvas.width = 300, h = canvas.height = 300;
        const particles = Array.from({length:40}, () => ({
          x: w/2, y: h/2,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 2,
          size: 2 + Math.random() * 3,
          life: 1,
          decay: 0.01 + Math.random() * 0.015,
          color: Math.random() > 0.3 ? "#00FF41" : "#00cc33",
        }));
        let frame = requestAnimationFrame(function animate() {
          ctx.clearRect(0, 0, w, h);
          let alive = false;
          for (const p of particles) {
            p.x += p.vx; p.y += p.vy;
            p.vy += 0.08;
            p.life -= p.decay;
            if (p.life > 0) {
              alive = true;
              ctx.globalAlpha = p.life;
              ctx.fillStyle = p.color;
              ctx.shadowBlur = 6; ctx.shadowColor = "#00FF41";
              ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
          }
          ctx.shadowBlur = 0; ctx.globalAlpha = 1;
          if (alive) frame = requestAnimationFrame(animate);
        });
        return () => cancelAnimationFrame(frame);
      }, []);
      return <canvas ref={canvasRef} style={{ position:"absolute", top:"50%", left:"50%", transform:"translate(-50%,-50%)", pointerEvents:"none", width:"300px", height:"300px", zIndex:10 }} />;
    }

    function InitScreen({ onComplete }) {
      const [name, setName] = useState("");
      const [codename, setCodename] = useState("");
      const [step, setStep] = useState(0); // 0=typing, 1=launching

      const handleLaunch = () => {
        if (!name.trim() || !codename.trim()) return;
        setStep(1);
        setTimeout(() => onComplete(name.trim(), codename.trim()), 2000);
      };

      const inputStyle = {
        width:"100%", background:"#000",
        border:"1px solid #1a1a1a", color:"#00FF41",
        fontFamily:"'JetBrains Mono','Courier New',monospace",
        fontSize:"13px", padding:"12px",
        outline:"none", caretColor:"#00FF41",
        letterSpacing:"0.05em", marginTop:"6px",
        transition:"border-color 0.2s",
      };

      if (step === 1) {
        return (
          <div style={{ textAlign:"center", padding:"40px 0" }}>
            <div className="flicker" style={{
              fontSize:"14px", color:"#00FF41",
              letterSpacing:"0.15em", lineHeight:"2.2",
              textShadow:"0 0 10px rgba(0,255,65,0.6)",
            }}>
              {">"} IDENTITY CONFIRMED<br/>
              {">"} INITIALIZING MISSION...<br/>
              {">"} WELCOME, {codename.toUpperCase()}<br/>

            </div>
          </div>

      }

      return (
        <div style={{ padding:"10px 0 30px" }}>
          <div style={{ marginBottom:"28px" }}>
            <div style={{ fontSize:"11px", color:"#00FF41", letterSpacing:"0.15em", marginBottom:"4px", textShadow:"0 0 8px rgba(0,255,65,0.5)" }}>
              // SYSTEM INITIALIZATION
            </div>
            <div style={{ fontSize:"11px", color:"#555", letterSpacing:"0.08em", lineHeight:"1.8" }}>
              {">"} First-time setup. This runs once.<br/>
              {">"} Identity will be locked to this device.
            </div>
          </div>

          {/* Name */}
          <div style={{ marginBottom:"20px" }}>
            <div style={{ fontSize:"10px", color:"#aaa", letterSpacing:"0.1em" }}>{">"} YOUR NAME:</div>
            <div className="input-group">
              <input
                type="text"
                value={name}
                onChange={e => setName(e.target.value)}
                placeholder="> e.g. Farman"
                maxLength={30}
                onFocus={e => e.target.style.borderColor="#00FF41"}
                onBlur={e => e.target.style.borderColor="#1a1a1a"}

              /><span className="cursor" />

          <div style={{ marginBottom:"28px" }}>
            <div style={{ fontSize:"10px", color:"#aaa", letterSpacing:"0.1em" }}>{">"} YOUR CODENAME:</div>

                type="text"
                value={codename}

                maxLength={20}
                onFocus={e => e.target.style.borderColor="#00FF41"}
                onBlur={e => e.target.style.borderColor="#1a1a1a"}

            <div style={{ fontSize:"9px", color:"#333", marginTop:"6px", letterSpacing:"0.05em" }}>

    // ============================================================
    // COMMAND PALETTE
    // ============================================================
    function CommandPalette({ open, onClose, onAction, state }) {
      const [query, setQuery] = useState("");
      const inputRef = useRef(null);
      useEffect(() => { if (open) { setQuery(""); setTimeout(() => inputRef.current?.focus(), 50); } }, [open]);
      if (!open) return null;
      const actions = [
        { id:"home", label:"Go to Home", keys:"⌘K" },
        { id:"report", label:"Open Report", keys:"⌘K" },
        { id:"stats", label:"Open Stats", keys:"⌘K" },
        { id:"history", label:"Open History", keys:"⌘K" },
        { id:"settings", label:"Open Settings", keys:"⌘K" },
        { id:"undo", label:"Undo Last Submission", keys:"⌘Z" },
        { id:"timer", label:"Toggle Session Timer", keys:"" },
        { id:"challenge", label:"Claim Daily Challenge", keys:"" },
        { id:"share", label:"Copy Share Card", keys:"" },
        { id:"export", label:"Export Logs", keys:"" },
      ];
      const filtered = query ? actions.filter(a => a.label.toLowerCase().includes(query.toLowerCase())) : actions;
      return (
        <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:9999, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"flex-start", justifyContent:"center", paddingTop:"12vh" }}>
          <div onClick={e => e.stopPropagation()} style={{ width:"420px", maxWidth:"90vw", border:"1px solid #2a2a2a", background:"#0a0a0a", boxShadow:"0 8px 40px rgba(0,0,0,0.8)" }}>
            <div style={{ padding:"12px 14px", borderBottom:"1px solid #1a1a1a" }}>
              <div className="input-group" style={{ display:"flex", alignItems:"center" }}>
                <span style={{ color:"#555", fontSize:"11px", marginRight:"8px" }}>{">"}</span>
                <input ref={inputRef} value={query} onChange={e => setQuery(e.target.value)} placeholder="Type a command..." onKeyDown={e => { if (e.key==='Escape') onClose(); }}
                  style={{ width:"100%", background:"transparent", border:"none", color: getTheme().accent, fontFamily:"'JetBrains Mono','Courier New',monospace", fontSize:"12px", outline:"none", caretColor: getTheme().accent }}
                /><span className="cursor" />
              </div>
            </div>
            <div style={{ maxHeight:"280px", overflowY:"auto" }}>
              {filtered.map(a => (
                <div key={a.id} onClick={() => { onAction(a.id); onClose(); }} style={{
                  padding:"9px 14px", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center",
                  borderBottom:"1px solid #0d0d0d", transition:"background 0.15s",
                }} onMouseEnter={e=>e.currentTarget.style.background="#00FF4108"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <span style={{ fontSize:"11px", color:"#ccc", letterSpacing:"0.05em" }}>{a.label}</span>
                  {a.keys && <span style={{ fontSize:"8px", color:"#555" }}>{a.keys}</span>}
                </div>
              ))}
              {filtered.length === 0 && <div style={{ padding:"14px", fontSize:"10px", color:"#444", textAlign:"center" }}>No commands match</div>}
            </div>
            <div style={{ padding:"8px 14px", borderTop:"1px solid #1a1a1a", fontSize:"7px", color:"#333", letterSpacing:"0.1em" }}>
              ESC TO CLOSE &middot; CTRL+K TO TOGGLE
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // MAIN APP
    // ============================================================
    function App() {
      const [appState, setAppState] = useState(null);
      const [screen, setScreen] = useState("loading");
      const [missedDays, setMissedDays] = useState(0);
      const [resetting, setResetting] = useState(false);
      const [soundOn, setSoundOn] = useState(soundEnabled());
      const [toasts, setToasts] = useState([]);
      const [lastSubmitSnapshot, setLastSubmitSnapshot] = useState(null);
      const [timerOpen, setTimerOpen] = useState(false);
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [paletteQuery, setPaletteQuery] = useState("");

      const addToast = (message, variant = "info") => {
        const id = ++toastId;
        setToasts(prev => [...prev, { id, message, variant }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      const applyTheme = (name) => { setTheme(name); addToast(`Theme saved. Reloading...`, "info"); setTimeout(() => window.location.reload(), 300); };

      useEffect(() => {
        const init = async () => {
          const raw = (await MockDB.getState()) || MockDB.defaultState();
          const t = today(), y = yesterday();
          if (!raw.name) { setAppState(raw); setScreen("init"); return; }
          if (raw.lastSubmitDate === t) { setAppState(raw); setScreen("filed"); return; }
          if (raw.lastSubmitDate && raw.lastSubmitDate !== y && raw.lastSubmitDate !== t) {
      const lastDate = new Date(raw.lastSubmitDate + 'T00:00:00');
      const todayDate = new Date(t + 'T00:00:00');
      setMissedDays(Math.max(1, Math.round((todayDate - lastDate) / 86400000) - 1));
      setAppState(raw); setScreen("breach"); return;
    }
          setAppState(raw); setScreen("checklist");
        };
        init();
        initReminderChecker();
        const handleKey = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); setPaletteOpen(p => !p); }
          if (e.key === 'Escape') setPaletteOpen(false);
        };
        document.addEventListener('keydown', handleKey);
        return () => document.removeEventListener('keydown', handleKey);
      }, []);

      const handleInit = (name, codename) => {
        const u = {...appState, name, codename};
        MockDB.setState(u); setAppState(u); setScreen("checklist");
        addToast("System initialized, Commander", "info");
      };

      const handleBreachResolve = (res) => {
        const u = {...appState};
        if (res==="reset") { u.streak = 0; addToast("Streak reset to 0", "error"); }
        else if (res==="freeze") { u.freezes = Math.max(0, (u.freezes||0) - 1); addToast("Streak freeze used", "info"); }
        else addToast("Streak preserved", "info");
        setAppState(u); MockDB.setState(u); setScreen("checklist");
      };

      const handleExport = () => {
        if (!appState?.logs?.length) return;
        const blob = new Blob([JSON.stringify({ logs: appState.logs, streak: appState.streak, name: appState.name, codename: appState.codename, exportedAt: new Date().toISOString() }, null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `commander-logs-${new Date().toISOString().slice(0,10)}.json`; a.click();
        URL.revokeObjectURL(url);
      };

      const fireWebhook = (event, data) => {
        const url = appState?.webhookUrl;
        if (!url) return;
        try { fetch(url, { method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body:JSON.stringify({event,...data,timestamp:new Date().toISOString()}) }); } catch {}
      };

      const handleSubmit = ({energy,alterEgo,improvement,tag}) => {
        setLastSubmitSnapshot(JSON.parse(JSON.stringify(appState)));
        const u = {...appState};
        u.lastSubmitDate = today();
        const wasGreen = !alterEgo;
        u.streak = alterEgo ? 0 : (u.streak||0)+1;
        if (wasGreen && [7,14,30,60,90].includes(u.streak)) u.freezes = (u.freezes||0) + 1;
        u.xp = (u.xp||0) + (alterEgo ? XP_PER_RED : XP_PER_GREEN);
        if (wasGreen && [7,14,30,60,90].includes(u.streak)) u.xp += XP_MILESTONE_BONUS;
        u.logs = [...(u.logs||[]), {date:today(),energy,alterEgo,improvement,tag:tag||""}];
        MockDB.setState(u); setAppState(u); setScreen("filed");
        addToast(alterEgo ? "Red day logged — streak reset" : "Green day logged", alterEgo ? "error" : "info");
        fireWebhook("submission", {name:u.name,codename:u.codename,streak:u.streak,xp:u.xp,result:alterEgo?"red":"green",improvement});
      };

      const handleUndo = () => {
        if (!lastSubmitSnapshot) return;
        MockDB.setState(lastSubmitSnapshot);
        setAppState(lastSubmitSnapshot);
        setScreen("checklist");
        setLastSubmitSnapshot(null);
        addToast("Last submission undone", "info");
      };

      const handleUpdateLogs = (newState) => {
        MockDB.setState(newState);
        setAppState(newState);
      };

      const handleReset = () => {
        try { localStorage.removeItem(LS_KEY); } catch {}
        setAppState(MockDB.defaultState());
        setScreen("init");
        setResetting(false);
        addToast("All data erased", "error");
      };

      const name = appState?.name || "Commander";
      const codename = appState?.codename || "CDR";

      const renderScreen = () => {
        if (screen==="loading"||!appState) return <div style={{textAlign:"center",padding:"40px",fontSize:"11px",color:"#666"}}>{">"} INITIALIZING SYSTEM...</div>;
        if (screen==="init") return <InitScreen onComplete={handleInit} />;
        if (screen==="breach") return <BreachScreen onResolve={handleBreachResolve} missedDays={missedDays} freezes={appState?.freezes||0} />;
        if (screen==="checklist") return <ChecklistForm state={appState} name={name} codename={codename} onSubmit={handleSubmit} timerOpen={timerOpen} onToggleTimer={() => setTimerOpen(!timerOpen)} />;
        if (screen==="filed") return <AlreadyFiledScreen state={appState} name={name} codename={codename} onUpdate={handleUpdateLogs} addToast={addToast} soundOn={soundOn} onToggleSound={() => { const n = toggleSound(); setSoundOn(n); }} onExport={handleExport} onReset={() => setResetting(true)} onUndo={handleUndo} timerOpen={timerOpen} onToggleTimer={() => setTimerOpen(!timerOpen)} onApplyTheme={applyTheme} />;
      };

      const handlePaletteAction = (actionId) => {
        if (screen==="filed") {
          if (actionId==="undo" && handleUndo) { handleUndo(); return; }
          if (actionId==="share") {
            const shareText = `═══ COMMANDER'S CHECKLIST ═══\nName: ${name} (${codename})\nStreak: ${appState?.streak||0} days\nTotal: ${appState?.logs?.length||0} audits\nWin Rate: ${appState?.logs?.length > 0 ? Math.round(appState.logs.filter(l=>!l.alterEgo).length/appState.logs.length*100) : 0}%\nXP: ${appState?.xp||0}\n═══ ${new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})} ═══`;
            navigator.clipboard?.writeText(shareText).then(() => addToast?.("Share card copied", "info")).catch(() => {});
            return;
          }
        }
        if (actionId==="export") { handleExport(); return; }
        if (actionId==="timer") { setTimerOpen(!timerOpen); return; }
        if (actionId==="challenge" && screen==="filed") {
          if (appState?.challenges?.[today()]) { addToast?.("Already claimed today", "info"); return; }
          const C = [
            { text:"Complete audit before 09:00", xp:20 }, { text:"Write a 50+ character journal entry", xp:15 },
            { text:"Score 100% energy on today's audit", xp:10 }, { text:"Mark a tag on today's entry", xp:10 },
            { text:"Log in before 12:00", xp:15 }, { text:"Achieve a 3-day streak", xp:25 },
            { text:"No red days this week", xp:30 }, { text:"Complete 5 audits this week", xp:20 },
            { text:"Write improvement for 3 consecutive days", xp:20 }, { text:"Use streak freeze wisely", xp:15 },
          ];
          const idx = (name?.length||0) + new Date().getDate() + new Date().getMonth();
          const c = C[idx % C.length];
          const u = {...appState, challenges:{...(appState?.challenges||{}), [today()]:true}, xp:(appState?.xp||0)+c.xp};
          MockDB.setState(u); setAppState(u);
          addToast?.(`Challenge complete! +${c.xp} XP`, "info");
          return;
        }
      };

      const dateStr = new Date().toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).toUpperCase();

      return (
        <>
          <CRTOverlay />
          <ToastContainer toasts={toasts} onDismiss={()=>{}} />
          <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} onAction={handlePaletteAction} state={appState} />
          <div className="app-container">

              {/* Header */}
              <div style={{ marginBottom:"8px" }}>
                <div style={{ fontSize:"10px", color:"#556", letterSpacing:"0.2em", marginBottom:"6px", display:"flex", alignItems:"center", gap:"8px" }}>
                  {">"} FALCON'S HUNT — CLASSIFIED SYSTEM v1.0
                  {appState?.codename ? ` — ${appState.codename.toUpperCase()}` : ""}
                  <span id="syncDot" title="OFFLINE" style={{ width:"7px", height:"7px", borderRadius:"50%", background:"#333", display:"inline-block", flexShrink:0, transition:"background 0.4s" }} />
                  <button onClick={handleExport} title="Export logs" style={{ background:"none", border:"none", cursor:"pointer", padding:"0", display:"flex", alignItems:"center", color:"#556" }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  </button>
                  <button onClick={() => setResetting(true)} title="Reset system" style={{ background:"none", border:"none", cursor:"pointer", padding:"0", display:"flex", alignItems:"center", color:"#FF000066" }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                  </button>
                  <button onClick={() => setPaletteOpen(true)} title="Command palette (Ctrl+K)" style={{ background:"none", border:"none", cursor:"pointer", padding:"0", display:"flex", alignItems:"center", color:"#556" }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                  </button>
                  <button onClick={() => { const next = toggleSound(); setSoundOn(next); }} title={soundOn ? "Mute sounds" : "Enable sounds"} style={{ background:"none", border:"none", cursor:"pointer", padding:"0", display:"flex", alignItems:"center", color: soundOn ? "#00FF4188" : "#333" }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                      {soundOn ? <><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></> : <line x1="20" y1="9" x2="14" y2="15"/>}
                    </svg>
                  </button>
                </div>
                <GlitchHeader />
                <div style={{ fontSize:"10px", color:"#556", letterSpacing:"0.1em", marginTop:"5px" }}>
                  {">"} {dateStr}
                </div>
              </div>

              {/* Divider */}
              <div style={{ height:"1px", background:"linear-gradient(90deg,var(--accent,#00FF41),transparent)", margin:"16px 0 24px" }} />

              {/* Screen */}
              {resetting ? (
                <div className="fade-up" style={{ padding:"10px 0 30px" }}>
                  <div style={{ fontSize:"11px", color:"#FF0000", letterSpacing:"0.15em", marginBottom:"16px", textShadow:"0 0 8px rgba(255,0,0,0.5)" }}>
                    // FACTORY RESET
                  </div>
                  <div style={{ fontSize:"12px", color:"#aaa", lineHeight:"2", marginBottom:"20px" }}>
                    {">"} This will permanently erase all logs,<br/>
                    {">"} streak data, and commander identity.<br/>
                    {">"} This action cannot be undone.
                  </div>
                  <Btn onClick={handleReset} variant="danger">Confirm Reset — Erase Everything</Btn>
                  <Btn onClick={() => setResetting(false)} variant="primary">Cancel</Btn>
                </div>
              ) : <div className="fade-up" key={screen}>{renderScreen()}</div>}

              {/* Footer */}
              <div style={{ marginTop:"40px", borderTop:"1px solid #0a0a0a", paddingTop:"16px", fontSize:"9px", color:"#444", letterSpacing:"0.1em", textAlign:"center" }}>
                // OPERATIONAL SECURITY ENABLED — ALL LOGS ENCRYPTED LOCALLY
              </div>
          </div>
        </>
      );
    }

    // Initialize theme
    setTheme(localStorage.getItem(THEME_KEY) || "cyber");

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.log('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
